{% extends "base.html" %}

{% block title %}Додати товар | Склад{% endblock %}

{% block content %}
<h2>Додати новий товар</h2>

<form method="post" class="product-form">
    {% csrf_token %}
    <div class="form-group">
        <label for="name">Назва товару:</label>
        <input type="text" id="name" name="name" required maxlength="150" placeholder="наприклад, М’яч футбольний">
    </div>

    <div class="form-group">
        <label for="category">Категорія:</label>
        <input type="text" id="category" name="category" required maxlength="100" placeholder="наприклад, Футбол">
    </div>

    <div class="form-group">
        <label for="material">Матеріал:</label>
        <input type="text" id="material" name="material" required maxlength="100" placeholder="наприклад, Синтетична шкіра">
    </div>

    <div class="form-group">
        <label for="brand">Бренд:</label>
        <input type="text" id="brand" name="brand" required maxlength="100" placeholder="наприклад, Nike">
    </div>

    <div class="form-group">
        <label for="price">Ціна (грн):</label>
        <input type="number" id="price" name="price" step="0.01" min="0" required placeholder="наприклад, 1250.00">
    </div>

    <div class="form-actions">
        <button type="submit" class="btn-submit">Додати товар</button>
        <a href="{% url 'products_list' %}" class="btn-cancel">Скасувати</a>
    </div>
</form>
{% endblock %}
